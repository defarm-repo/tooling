[package]
name = "defarm-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Official DeFarm SDK for Rust — auth, items, events, disclosures and receipts"
repository = "https://github.com/defarm-repo/tooling"
homepage = "https://defarm.net"
documentation = "https://docs.rs/defarm-sdk"
keywords = ["defarm", "traceability", "agri", "stellar", "tokenization"]
categories = ["api-bindings"]
readme = "README.md"

[dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
url = "2"

[dev-dependencies]
httpmock = "0.7"
tokio = { version = "1", features = ["full"] }
