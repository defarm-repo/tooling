[package]
name = "marketplace-miniapp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Example miniapp: lists DFIDs for sale with finance_basic disclosures attached"
publish = false

[dependencies]
defarm-miniapp = { path = "../.." }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
